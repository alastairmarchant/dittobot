# This workflow tags, publishes and releases a new version whenever the
# `version` field in `package.json` changes on `main`.
#
# The tag is pushed with `GITHUB_TOKEN`, and GitHub does not trigger workflows
# for refs pushed with that token, so the publish and release steps have to live
# in this same workflow rather than in a separate tag-triggered one.
name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    tag:
        name: Tag New Version
        runs-on: ubuntu-latest

        permissions:
            contents: write

        outputs:
            tag: ${{ steps.tag-version.outputs.tag }}
            version: ${{ steps.tag-version.outputs.current-version }}

        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v7
              with:
                  # The action diffs `HEAD~1` against `HEAD`, and guards against
                  # re-tagging by looking for the tag in the local clone.
                  fetch-depth: 2
                  fetch-tags: true

            - name: Detect and Tag New Version
              id: tag-version
              uses: alastairmarchant/action-tag-new-version@v2

    publish:
        name: Publish Docker Image
        runs-on: ubuntu-latest
        needs: tag
        if: needs.tag.outputs.tag != ''

        permissions:
            attestations: write
            contents: read
            id-token: write
            packages: write

        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.tag.outputs.tag }}

            - name: Set up QEMU
              id: setup-qemu
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              id: setup-buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              id: login
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker Metadata
              id: metadata
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  # `value` is required: the semver types read a tag ref by
                  # default, but this workflow runs on a branch push.
                  tags: |
                      type=semver,pattern={{version}},value=${{ needs.tag.outputs.version }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.version }}
                      type=semver,pattern={{major}},value=${{ needs.tag.outputs.version }}
                      type=raw,value=latest

            - name: Build and Push Docker Image
              id: build
              uses: docker/build-push-action@v7
              with:
                  annotations: ${{ steps.metadata.outputs.annotations }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  context: .
                  labels: ${{ steps.metadata.outputs.labels }}
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.metadata.outputs.tags }}
                  target: production

            - name: Attest Build Provenance
              id: attest
              uses: actions/attest-build-provenance@v4
              with:
                  push-to-registry: true
                  subject-digest: ${{ steps.build.outputs.digest }}
                  subject-name: ghcr.io/${{ github.repository }}

    release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        needs:
            - tag
            - publish
        if: needs.tag.outputs.tag != ''

        permissions:
            contents: write

        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v7

            - name: Create Release
              id: create-release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.tag.outputs.tag }}
              run: |
                  gh release create "$TAG" \
                      --generate-notes \
                      --title "$TAG" \
                      --verify-tag
